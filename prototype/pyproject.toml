[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trotamundos-prototype"
version = "0.1.0"
description = "Prototipo integrado de webhook, Outbox, RabbitMQ e Inbox/CQRS para Trotamundos"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "pika>=1.3,<2.0", "httpx>=0.27,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
