services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trotamundos
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos -d trotamundos"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  outbox-relay:
    build: .
    command: python -m app.relay
    env_file: .env
    depends_on:
      api: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  event-consumer:
    build: .
    command: python -m app.consumer
    env_file: .env
    depends_on:
      api: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  provider-simulator:
    build: .
    command: uvicorn app.simulator:app --host 0.0.0.0 --port 8001
    env_file: .env
    ports: ["8001:8001"]
    depends_on: {api: {condition: service_healthy}}
volumes:
  postgres_data:
